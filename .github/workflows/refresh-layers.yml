# Refresh the globe's data layers without anyone's computer: build them on GitHub's runners on a schedule and upload
# them to Cloudflare R2 (bucket oceany-layers, folder data/). The globe reads data/latest.json from there
# (pieces/07-globe/data-source.js). Nothing is committed to git; the data files in the repo are only the fallback.
# Research and play only: not a forecast or warning service.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY (an R2 API token with Object Read & Write on the oceany-layers bucket only).
# Run by hand: Actions > Refresh globe layers > Run workflow, and name the layers.
name: Refresh globe layers

on:
  schedule:
    - cron: '25 4,10,16,22 * * *'   # wind, waves, swell: about 4.5 h after each GFS / GFS-Wave run (00, 06, 12, 18 UTC)
    - cron: '40 13 * * *'           # daily: snow and sea ice (IMS, posted about a day late), hurricane records (IBTrACS)
    - cron: '10 2 3 * *'            # monthly: earthquakes since 1970 (USGS ComCat), US tornado records (SPC)
  workflow_dispatch:
    inputs:
      layers:
        description: 'Layers to build, space-separated: ocean snow hurricanes tornadoes quakes'
        required: true
        default: 'ocean'

permissions:
  contents: read
  actions: write          # only for the keep-alive step at the end (GitHub pauses schedules in quiet public repos)

concurrency:              # one run at a time, so two runs never write latest.json together
  group: refresh-layers
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Secr3tG/oceany'     # forks do not try to upload
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the two packages the builders use
        run: pip install --disable-pip-version-check numpy==2.0.2 pillow==11.3.0

      - name: Pick the layers for this run
        id: pick
        env:
          SCHED: ${{ github.event.schedule }}
          ASKED: ${{ inputs.layers }}
        run: |
          case "$SCHED" in
            '25 4,10,16,22 * * *') L="ocean" ;;
            '40 13 * * *')         L="snow hurricanes" ;;
            '10 2 3 * *')          L="quakes tornadoes" ;;
            *)                     L="$ASKED" ;;
          esac
          for l in $L; do
            case "$l" in ocean|snow|hurricanes|tornadoes|quakes) ;; *) echo "::error::unknown layer '$l'"; exit 1 ;; esac
          done
          echo "layers=$L" >> "$GITHUB_OUTPUT"
          echo "Layers: $L"

      # The earthquake builder keeps one CSV per year in raw/ and only downloads the current year again when the
      # earlier ones are there; the cache saves about 57 requests to USGS each month.
      - name: Restore the earthquake download cache
        if: contains(steps.pick.outputs.layers, 'quakes')
        uses: actions/cache@v4
        with:
          path: pieces/12-quakes/raw
          key: quakes-raw-${{ github.run_id }}
          restore-keys: quakes-raw-

      - name: Build
        id: build
        env:
          LAYERS: ${{ steps.pick.outputs.layers }}
        run: |
          build() {
            case "$1" in
              ocean)      python pieces/11-ocean/build_ocean.py ;;
              snow)       python pieces/10-sky/build_snow.py ;;
              hurricanes) python pieces/08-storms/build_hurricanes.py && python pieces/08-storms/build_hurricane_radii.py ;;
              tornadoes)  python pieces/08-storms/build_tornadoes.py ;;
              quakes)     python pieces/12-quakes/build_history.py ;;
            esac
          }
          ok=""; failed=""
          for l in $LAYERS; do     # one failed layer does not stop the others (a test inside `if` is exempt from bash -e)
            echo "::group::build $l"
            if build "$l"; then ok="$ok $l"; else failed="$failed $l"; echo "::warning::$l build failed; the published copy stays"; fi
            echo "::endgroup::"
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Upload to R2 and update latest.json
        if: steps.build.outputs.ok != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OK: ${{ steps.build.outputs.ok }}
        run: python scripts/publish_layers.py $OK --dest r2

      - name: Keep the schedule alive
        if: github.event.schedule == '10 2 3 * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable refresh-layers.yml --repo "$GITHUB_REPOSITORY" || true

      - name: Report failed builds
        if: steps.build.outputs.failed != ''
        env:
          FAILED: ${{ steps.build.outputs.failed }}
        run: |
          echo "::error::build failed for:$FAILED (the other layers were published)"
          exit 1
